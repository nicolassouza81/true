<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — True Eventos</title>
    <link rel="icon" href="/public/assets/brand/true-square-white-on-black.svg">
    <link rel="stylesheet" href="/public/css/tokens.css">
    <link rel="stylesheet" href="/public/css/reset.css">
    <link rel="stylesheet" href="/public/css/base.css">
    <link rel="stylesheet" href="/public/css/components.css">
    <link rel="stylesheet" href="/public/css/utilities.css">
</head>
<body>
    <header class="site-header">
    <div class="container site-header__inner">
        <a href="/" class="site-header__brand">
            <img src="/public/assets/brand/true-horizontal-black.svg" alt="True Eventos" height="28">
        </a>

        <nav class="site-nav">
                            <a href="/login" class="site-nav__link">Entrar</a>
                <a href="/register" class="btn btn--primary btn--sm">Criar conta</a>
                    </nav>
    </div>
</header>

    <main class="main-content">
        
        
        <section class="auth-page container">
    <div class="auth-card">
        <h1 class="auth-card__title">Acesso Administrativo</h1>

        
        <form action="/login" method="POST" class="form" novalidate>
            <input type="hidden" name="_csrf" value="100d78a6a174deb903860cdb4fe9bc14de453c5e35ada960e84a16350a5aba04">

            <div class="form__group">
                <label for="email" class="form__label">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form__input"
                    value=""
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form__group">
                <label for="password" class="form__label">Senha</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form__input"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form__footer">
                <a href="/forgot-password" class="form__link">Esqueci minha senha</a>
                <a href="/" class="form__link">← Voltar ao site</a>
            </div>

            <button type="submit" class="btn btn--primary btn--full">Entrar no Painel</button>
        </form>
    </div>
</section>
    </main>

    <footer class="site-footer">
    <div class="container site-footer__inner">
        <p class="site-footer__copy">
            &copy; 2026 True Eventos. Todos os direitos reservados.
        </p>
    </div>
</footer>

    <script type="module" src="/public/js/main.js"></script>
</body>
</html>
